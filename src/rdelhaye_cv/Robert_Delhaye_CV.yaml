      username: rdelhaye
  sections:
    projects:
      - name: 'Financial Reconciliation AI Agent'
        date:
        start_date: 2025-09
        end_date: present
        location:
        summary: "AI Agent invoked on regular schedule, that checks a specific email folder for valid files to parse. Breaks task down to deterministic and AI-appropriate subtasks, uses reasoning model to identify pertinent headers in freeform files, and Python code to prepare consistent output files for SME use. Expected to increase SME team's ingestion of supplier statements by factor of five."
        highlights:
          - Agent specified as code, deployed in Azure AI Foundry project
          - Deterministic code aspects rigourously covered by CI/CD testing pipeline.
          - Non-deterministic aspects covered by Agent Evaluation tooling, with a robust set of test fixtures.
      - name: 'Container Unloading Prioritisation'
        date: 2023
        start_date:
        end_date:
        location:
        summary: "Flexible prioritisation workflow to determine which ISO shipping container of stock represents most urgent and greatest value return on labour investment. Considers sales and margin dollars of each container's contents against the container complexity, likelihood of being on-site to be worked, and risk of detention penalties."
        highlights:
          - Instrumental in bringing business logic into light for discussion about correct ways of working.
          - Built modularly, allowing easy migration from one data warehouse to its replacement, and introduction of state of art ERP sales forecast solution.
          - Associated diagnostic tools to explain why containers were _not_ prioritised also included, later converted to Snowflake Intelligence agent.
      - name: "Container Detention Simulation"
        date: 2024
        summary: "User-facing GUI tool to display the coming quarter of ISO shipping containers, model the expected labour throughput, and estimate incurred detention risk. Includes probabilistic time smoothing of volume arrival to reflect the uncertainty in international shipping."
        highlights:
          - Provided essential forum for alignment between long term inbound volume, and labour cost management.
          - Built in RShiny, with a data snapshot system to ensure consistent behaviour throughout the week.
    experience:
    - company: The Warehouse Group 
      position: Senior Data Scientist
      location: Auckland, New Zealand 
      start_date: 2021-05 # May 2021
      end_date: "present"
      highlights:
        - Delivered solutions across multiple areas of the business.
          - Supply Chain -- Critical prioritisation tools, scenario planning and simulation tools.
          - Tech -- Price optimisation modelling for products with high degree of competition and complex margin structure.
          - Property -- Flexible toolkit to rapidly assess geospatial context of branch locations, using up to date demographic and transit data
          - AI Enablement -- Explored and upskilled team with ability to provision tools to AI Agents, use state of art evaluation tooling, and templating of instructions
        - High level of interaction with stakeholders in both Design Thinking and build phases of work. 
        - Support, knowledge sharing, and mentoring of peers in own and adjacent teams. 
    - company: "Dublin Institute for Advanced Studies (DIAS) "
      position: Postdoctoral Researcher 
      location: Dublin, Ireland 
      start_date: 2018-11 # NOV 2018
      end_date: 2020-11 # NOV 2020
      highlights:
        - Developed, tested, and documented software tools and field procedures to correctly acquire and process geophysical data from the Institute’s controlled source audiomagnetotelluric equipment. 
        - Supported ongoing geophysical research and monitoring. 

    - company: BRG Ltd 
      position: Geophysicist 
      location: Limerick, Ireland 
      start_date: 2018-01 # JAN 2018
      end_date: 2018-03 # MAR 2018
      highlights:
        - Oversaw field campaign of two field teams for collection of audiomagnetotelluric (AMT) data at over 200 locations. 
        - Extensive data processing, QC on data delivered to client, and ongoing technical support to client. 


    education:
      - institution: National University of Ireland, Galway
        area: Earth and Ocean Sciences
        degree: PhD
        grade:
        date:
        start_date: 2012-01
        end_date: 2018-09
        location: Dublin, Republic of Ireland
        summary: "PhD funded by Dublin Institute for Advanced Studies (DIAS) as part of the IRETHERM project. Research examined the possibility and quantification of a porosity-hosted geothermal reservoir in the Rathlin sedimentary Basin in Northern Ireland by magnetotelluric methods. Doctoral thesis submitted in May 2018, and successfully defended in September 2018."
        highlights:
          - "Focus on correcting noise-affected field data, quantifying aquifer resources, and interrogating modelling results for artefact structures from numerical smoothing."
          - "Teaching experience at 2014 AfricaArray Field School and several iterations of the DIAS Applied Geophysics course."
      - institution: University of Auckland
        area: Physics
        degree: MSc (Hons)
        grade:
        date:
        start_date: 2010-12
        end_date: 2021-12
        location: Auckland, New Zealand
        summary: "MSc research focused on fault imaging on sedimentary basin margins by application of the magnetotelluric method, particularly by use of the tipper transfer function. The research included primarily practical and computational components, with fieldwork components in both Australia and New Zealand."
    skills:
      - label: Core Programming & Languages
        details: Python, R, MATLAB, SQL (Snowflake and Teradata).
      - label: Machine Learning & AI
        details: MLFlow, Azure Machine Learning and AI Foundry platforms. Agent development in Semantic Kernel, using AI Foundry Agent Service. New developments in Snowflake AI space.
      - label: Tools, Verson Control & other
        details: Git habits, LaTeX typesetting, geospatial toolkits. Unittest, Pytest, Ruff, SQLFluff extensively used to ensure correct code. ElasticSearch-based logging to support solutions. Documentation with TechDocs and Mermaid.
      - label: Mathematics
        details: Strong understanding of differential equations, calculus, linear algebra, and statistics.
      - label: Languages
        details: 'English (native), French (fluent)'
    publications:
